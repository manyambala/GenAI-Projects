services:
  helpflow-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: helpflow-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: sqlite:///./data/helpflow.db
    volumes:
      - sqlite-data:/app/data
      - backups:/app/data/backups
      - documents:/app/data/documents
      - vector-index:/app/data/vector_index
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  helpflow-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: helpflow-frontend
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      API_URL: http://helpflow-api:8000
    depends_on:
      helpflow-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite-data:
  backups:
  documents:
  vector-index:

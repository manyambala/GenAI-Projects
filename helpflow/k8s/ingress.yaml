apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpflow
  namespace: helpflow
spec:
  ingressClassName: nginx
  rules:
    - host: helpflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpflow-frontend
                port:
                  name: http

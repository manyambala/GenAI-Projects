apiVersion: v1
kind: ConfigMap
metadata:
  name: helpflow-config
  namespace: helpflow
data:
  APP_ENV: "production"
  DATABASE_URL: "sqlite:////app/data/helpflow.db"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.2:3b"
  LOG_LEVEL: "INFO"
  LOG_DIR: "/app/data/logs"
  LOG_TIMEZONE: "Asia/Kolkata"
  CORS_ORIGINS: "http://localhost:8501"
